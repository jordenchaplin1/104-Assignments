<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration | Paw Paws Pet Salon</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="registration.css">
</head>

<body>
    <header>Paw Paws Pet Salon</header>

    <nav>
        <a href="index.html">About Us</a>
        <a href="registration.html">Registration</a>
    </nav>

    <main class="container my-4">
        <h1>Pet Registration</h1>

        <form id="registrationForm" class="border rounded p-4 mb-4">
            <div class="mb-3">
                <label for="petName" class="form-label">Name</label>
                <input
                    type="text"
                    id="petName"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="petAge" class="form-label">Age in years</label>
                <input
                    type="number"
                    id="petAge"
                    class="form-control"
                    min="0"
                    step="1"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="petBreed" class="form-label">Breed</label>
                <input
                    type="text"
                    id="petBreed"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="petGender" class="form-label">Gender</label>
                <select id="petGender" class="form-select" required>
                    <option value="">Select gender</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="petService" class="form-label">Service</label>
                <select id="petService" class="form-select" required>
                    <option value="">Select service</option>
                    <option value="bath & brush">Bath &amp; brush</option>
                    <option value="bath, deshed, & trim">
                        Bath, deshed, &amp; trim
                    </option>
                    <option value="bath & trim">Bath &amp; trim</option>
                    <option value="bath & nail trim">
                        Bath &amp; nail trim
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Register
            </button>

            <button type="reset" class="btn btn-secondary">
                Reset
            </button>
        </form>

        <p id="registrationMessage" role="status" aria-live="polite"></p>

        <h2>Registered Pets</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Age</th>
                        <th scope="col">Gender</th>
                        <th scope="col">Service</th>
                        <th scope="col">Breed</th>
                        <th scope="col">Delete</th>
                    </tr>
                </thead>

                <tbody id="petTableBody"></tbody>
            </table>
        </div>
    </main>

    <script src="registration.js"></script>
</body>
</html>
